# Development infrastructure for Content Factory: Postgres, Redis and the admin
# UIs. The application itself runs on the host via `pnpm run dev`, not here.
#
# It is **not** intended for production use — production is
# `deploy/production/docker-compose.yaml`, described in
# `docs/operations/production-deploy.md`.
#
# The names below were inherited from upstream and carried its brand. They are
# local development identifiers only — no production object and no stored record
# depends on them — so they now say what this product is called.
#
# A machine that ran the old stack still has its containers and volumes under the
# previous names. They are not migrated automatically and they still hold the old
# local database: stop and remove them before bringing this file up, or the port
# bindings collide.
#
#   docker rm -f postiz-postgres postiz-redis postiz-pg-admin postiz-redisinsight
#   docker volume ls | grep postiz    # remove by hand once the data is not wanted
#
# `docker compose -f docker-compose.dev.yaml up -d` (bare, no service names)
# starts every service in this file, container names included. Those names are
# global on the Docker host, not scoped to this compose project: a neighboring
# checkout that still runs the stock Temporal quick-start (services literally
# named `temporal`, `temporal-ui`, `temporal-admin-tools`, ...) collides on
# both the container name and the published port. The failure mode is not a
# refused connection — the app silently keeps talking to whichever Temporal
# instance already held the port, workflows and namespace included. Bring
# infrastructure up by name when another project may already be running:
#
#   docker compose -f docker-compose.dev.yaml up -d cf-dev-postgres cf-dev-redis cf-dev-temporal

services:
  cf-dev-postgres:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:17-alpine # 17.0
    container_name: cf-dev-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: cf-dev-pwd
      POSTGRES_USER: cf-dev
      POSTGRES_DB: cf-dev-db
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - cf-dev-network
  cf-dev-redis:
    # ref: https://hub.docker.com/_/redis
    image: redis:7-alpine # 7.4.0
    container_name: cf-dev-redis
    restart: always
    ports:
      - 6380:6379
    networks:
      - cf-dev-network
  cf-dev-pg-admin:
    # ref: https://hub.docker.com/r/dpage/pgadmin4/tags
    image: dpage/pgadmin4:latest
    container_name: cf-dev-pg-admin
    restart: always
    ports:
      - 8081:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - cf-dev-network
  cf-dev-redisinsight:
    # ref: https://hub.docker.com/r/redis/redisinsight
    image: redis/redisinsight:latest
    container_name: cf-dev-redisinsight
    links:
      - cf-dev-redis
    ports:
      - '5540:5540'
    volumes:
      - redisinsight:/data
    networks:
      - cf-dev-network
    restart: always

  cf-dev-temporal-elasticsearch:
    container_name: cf-dev-temporal-elasticsearch
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - cf-dev-temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  cf-dev-temporal-postgresql:
    container_name: cf-dev-temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - cf-dev-temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data

  cf-dev-temporal:
    container_name: cf-dev-temporal
    ports:
      - "7234:7233"
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - cf-dev-temporal-postgresql
      - cf-dev-temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=cf-dev-temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=cf-dev-temporal-elasticsearch
      - ES_VERSION=v7
      # auto-setup registers its default namespace under DEFAULT_NAMESPACE, not
      # TEMPORAL_NAMESPACE — the app's own env var of that name (see
      # `.env.example`) only tells the *client* which namespace to connect to.
      # They must name the same namespace or the client fails at startup with
      # "namespace not found".
      - DEFAULT_NAMESPACE=cf-dev
    networks:
      - cf-dev-temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  cf-dev-temporal-admin-tools:
    container_name: cf-dev-temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    environment:
      - TEMPORAL_ADDRESS=cf-dev-temporal:7233
      - TEMPORAL_CLI_ADDRESS=cf-dev-temporal:7233
    networks:
      - cf-dev-temporal-network
    stdin_open: true
    depends_on:
      - cf-dev-temporal
    tty: true

  cf-dev-temporal-ui:
    container_name: cf-dev-temporal-ui
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=cf-dev-temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - cf-dev-temporal-network
    ports:
      - "8080:8080"

# Volume names are pinned rather than derived from the directory.
#
# Compose names a volume `<project>_<volume>`, and the project defaults to the
# directory name. This stand was first raised from a worktree called `cf-cj4`,
# so the development database lives in `cf-cj4_postgres-volume` — and moving the
# checkout to a differently named directory would have quietly raised an empty
# stand beside it, with the real data still on disk and no longer reachable.
# The prefix is a fossil of that worktree; the data is not.
volumes:
  redisinsight:
    name: cf-cj4_redisinsight
  postgres-volume:
    name: cf-cj4_postgres-volume
    external: false

networks:
  cf-dev-network:
    external: false
  cf-dev-temporal-network:
    driver: bridge
    name: cf-dev-temporal-network
