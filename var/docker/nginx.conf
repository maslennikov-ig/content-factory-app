user                            www;
worker_processes                auto; # it will be determinate automatically by the number of core

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    # The browser transport creates one 22-character base64url nonce for the
    # lifetime of a page. Only that exact Content-Type parameter can become a
    # relay bucket; malformed or missing values share one fixed bucket instead
    # of allocating attacker-controlled keys. The 64 KiB zone is the hard
    # memory bound. No IP, User-Agent, cookie, URL or body content participates.
    map $http_content_type $cf_browser_error_client {
        default "invalid-browser-error-client";
        "~^application/json; cf-client=([A-Za-z0-9_-]{22})$" $1;
    }
    limit_req_zone              $cf_browser_error_client zone=browser_error_relay:64k rate=5r/s;

    # This nginx is not the edge. In production Caddy terminates TLS, writes the
    # real client into `X-Real-IP` and `X-Forwarded-For`, and proxies here; a
    # plain `proxy_set_header X-Real-IP $remote_addr` would then overwrite the
    # client with Caddy's container address, identical for every request, and
    # the backend's per-caller rate limits would collapse into one shared
    # bucket for the whole instance.
    #
    # So an ingress-supplied value is passed through and `$remote_addr` is used
    # only when there is none — which is the direct-container case, where
    # `$remote_addr` really is the client. Nothing here trusts the browser:
    # Caddy replaces both headers rather than appending, so a value forged by a
    # caller is destroyed before it reaches this hop.
    map $http_x_real_ip $cf_client_address {
        default                 $http_x_real_ip;
        ""                      $remote_addr;
    }
    client_max_body_size 2G;
    server {
        listen 5000;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Docker's embedded DNS, and the only reason it is named here.
        #
        # nginx resolves a literal host in `proxy_pass` once, while it loads the
        # configuration, and refuses to start when the name is missing. The
        # newsletter container is owner-run: it is deliberately absent until the
        # host owner has bootstrapped its database, so a literal
        # `proxy_pass http://cf-listmonk:9000` would make an unconfigured
        # Listmonk stop nginx, and with it the entrypoint, the backend, the
        # frontend and the orchestrator.
        #
        # A `proxy_pass` that goes through a variable is resolved per request
        # instead, which needs this resolver. The absent container then costs
        # a 502 on `/newsletter/*` and nothing else.
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $cf_listmonk http://cf-listmonk:9000;

        # Listmonk stays private. Only its opaque confirmation/unsubscribe
        # pages and their versioned static assets cross the application proxy.
        location ^~ /newsletter/public/static/ {
            rewrite ^/newsletter(/.*)$ $1 break;
            proxy_pass $cf_listmonk;
            # A missing newsletter container must read as a fast 502 on its own
            # routes, not as a request that hangs on the shared proxy.
            proxy_connect_timeout 5s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ "^/newsletter/subscription/optin/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" {
            # The `?` drops the query string, and that is what keeps double
            # opt-in double.
            #
            # Listmonk decides confirmation with
            # `strconv.ParseBool(c.FormValue("confirm"))`, and `FormValue` on a
            # GET reads the query string; the route is registered for GET as
            # well as POST. So `…/optin/<uuid>?confirm=true` confirms a
            # subscription in one unauthenticated GET, which a link prefetch or
            # a mail scanner can perform instead of the person. Listmonk's own
            # message never carries that parameter — it formats the link with an
            # empty query — so nothing legitimate arrives here with one.
            #
            # Checked against listmonk `v6.2.0`: `cmd/public.go` `OptinPage`,
            # routes at `cmd/handlers.go`, link built in
            # `internal/manager/manager.go`. Its own `app.show_optin_page`
            # setting is the other way to lose the interstitial page, and it is
            # a toggle in an admin UI this repository does not control — which
            # is the reason to enforce the query here rather than trust it.
            rewrite ^/newsletter(/.*)$ $1? break;
            proxy_pass $cf_listmonk;
            proxy_connect_timeout 5s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ "^/newsletter/subscription/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" {
            rewrite ^/newsletter(/.*)$ $1 break;
            proxy_pass $cf_listmonk;
            proxy_connect_timeout 5s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /newsletter/ { return 404; }

        # Browser diagnostics stop at this exact first-party path. Nothing from
        # the inbound request except the declared origin, JSON type and length
        # crosses into Next, and this path never enters the access log.
        location = /api/browser-errors {
            access_log off;
            error_log /dev/null crit;
            client_max_body_size 16k;
            limit_req zone=browser_error_relay burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://localhost:4200/api/browser-errors;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 250ms;
            proxy_send_timeout 500ms;
            proxy_read_timeout 500ms;
        }

        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $cf_client_address;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://localhost:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $cf_client_address;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}
