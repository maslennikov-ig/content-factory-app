---
name: "Code Quality Analysis"

on:
  push:
    branches:
      - main
    # Every published main commit needs a fresh exact-head analysis, including
    # changes to workflows and test infrastructure.


jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    # Hosted analysis belongs to the published tree, like the Build workflow.
    # The private history repository allocates no runner/paid scanning job.
    # Exact string comparison also refuses an absent repository context.
    if: github.repository == 'maslennikov-ig/content-factory-app'

    runs-on: 'ubuntu-latest'
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
