---
name: Build

on:
  push:
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    

    strategy:
      matrix:
        node-version: ['22.23.2']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

#      - name: Setup pnpm cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ${{ env.STORE_PATH }}
#            ${{ github.workspace }}/.next/cache
#          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
#          restore-keys: |
#            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          # `nest build` for apps/backend reaches V8's default heap ceiling on a
          # standard runner and dies with "Ineffective mark-compacts near heap
          # limit", which is why every Build run in this repository's history
          # has failed while the same command succeeds locally. The ceiling is
          # the constraint, not the code.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

  full-suite:
    # `pnpm run build` and the Docker-backed proofs were the only things CI ran,
    # so the fourteen tests that turned red on 25.08.2026 were invisible here:
    # they live in suites no job executes. This job runs the whole of `pnpm test`
    # — the same command `AGENTS.md` names in release acceptance — and then reads
    # its log to confirm all three halves reported.
    #
    # It became affordable with the move to a public repository: on the private
    # one these minutes were billed, and a six-to-eight minute run on every push
    # was the reason the full suite stayed out of CI.
    name: Full test suite (required)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          # Pinned to `.nvmrc`. Under Node 24 the funnel proof fails with an
          # error about the shell's version rather than about the code.
          node-version: '22.23.2'

      - name: Install pnpm 10.6.1
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the full suite
        env:
          # The jest half builds enough of the workspace to meet the same V8
          # heap ceiling the Build job documents.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee suite.log

      - name: Confirm all three halves reported
        # Always: when the run fails, this names which half never got to speak.
        if: always()
        run: node scripts/ci/assert-suite-halves.cjs suite.log

      - name: Keep the log when the suite did not pass
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: suite.log
          retention-days: 7

  docker-backed-operations:
    name: Docker-capable execution proofs (required)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Install pnpm 10.6.1
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required Docker-backed execution proofs
        run: ./scripts/ci/run-docker-backed-ci.sh --require-docker
