---
name: Build

on:
  push:
    branches: [main]
  merge_group:
  pull_request:

# Replace older attempts for the same ref, without cancelling another workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The private repository owns history; the public copied tree owns hosted CI.
# Gate before allocating any runner or service container (including PR events).
jobs:
  build:
    if: github.repository == 'maslennikov-ig/content-factory-app'
    runs-on: ubuntu-latest
    

    strategy:
      matrix:
        node-version: ['22.23.2']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

#      - name: Setup pnpm cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ${{ env.STORE_PATH }}
#            ${{ github.workspace }}/.next/cache
#          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
#          restore-keys: |
#            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          # `nest build` for apps/backend reaches V8's default heap ceiling on a
          # standard runner and dies with "Ineffective mark-compacts near heap
          # limit", which is why every Build run in this repository's history
          # has failed while the same command succeeds locally. The ceiling is
          # the constraint, not the code.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

  full-suite-shards:
    if: github.repository == 'maslennikov-ig/content-factory-app'
    # Native Jest partitioning; each hosted shard has its own PG/Redis.
    name: Jest coverage + handles (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # The October native suite exceeded 45 minutes without a failed test.
    # Leave headroom for runner setup and all three halves; probe budgets remain bounded.
    timeout-minutes: 60


    # Native Mastra proofs use disposable schemas in a real local PG/Redis pair.
    # Each hosted job owns these services; no development or production URL is used.
    services:
      native-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cf-dev
          POSTGRES_PASSWORD: cf-dev-pwd
          POSTGRES_DB: cf-dev-db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cf-dev -d cf-dev-db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      native-redis:
        image: redis:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CF_JEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      JEST_JUNIT_OUTPUT_DIR: coverage/shard
      CF_TEST_PG_URL: postgresql://cf-dev:cf-dev-pwd@127.0.0.1:5433/cf-dev-db
      CF_TEST_REDIS_URL: redis://127.0.0.1:6380

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          # Pinned to `.nvmrc`. Under Node 24 the funnel proof fails with an
          # error about the shell's version rather than about the code.
          node-version: '22.23.2'

      - name: Install pnpm 10.6.1
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for editor geometry tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare isolated research recovery images
        # The process-restart proof owns separate PG/Redis containers and never pulls during tests.
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine

      - name: Run the complete assigned Jest shard
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          mkdir -p coverage/shard
          node scripts/ci/jest-shards.cjs record full "$CF_JEST_SHARD" coverage/shard
          pnpm run test:jest --shard="$CF_JEST_SHARD" --json --outputFile=coverage/shard/results.json --coverageDirectory=coverage/shard --coverageReporters=json 2>&1 | tee coverage/shard/suite.log

      - name: Keep native results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-shard-${{ matrix.shard }}
          path: coverage/shard/
          if-no-files-found: error
          retention-days: 1

  time-travel-shards:
    if: github.repository == 'maslennikov-ig/content-factory-app'
    # A suite that only ever runs on today's date cannot see a fixture aging
    # out from under it. On 31.08.2026 five backup tests went red at 12:00 UTC
    # on code nobody had touched — a pinned artifact name judged against the
    # real clock — and the same shape had already been seen on 21.08.2026. The
    # morning run was green; there was no warning between the two.
    #
    # So the suite runs a second time with the calendar moved forward. A
    # failure here is a test that depends on today, not a broken feature, and
    # it arrives a year before a user would have met it.
    name: Jest +400 days (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # The growing native suite can exceed 30 minutes on a hosted runner.
    # Keep the same job budget as the complete ordinary suite.
    timeout-minutes: 60


    # Native Mastra proofs use disposable schemas in a real local PG/Redis pair.
    # Each hosted job owns these services; no development or production URL is used.
    services:
      native-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cf-dev
          POSTGRES_PASSWORD: cf-dev-pwd
          POSTGRES_DB: cf-dev-db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cf-dev -d cf-dev-db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      native-redis:
        image: redis:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CF_JEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      CF_TEST_PG_URL: postgresql://cf-dev:cf-dev-pwd@127.0.0.1:5433/cf-dev-db
      CF_TEST_REDIS_URL: redis://127.0.0.1:6380

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Install pnpm 10.6.1
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for editor geometry tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare isolated research recovery images
        # The process-restart proof owns separate PG/Redis containers and never pulls during tests.
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine

      - name: Run the complete assigned calendar shard
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          mkdir -p coverage/shard
          node scripts/ci/jest-shards.cjs record calendar "$CF_JEST_SHARD" coverage/shard
          pnpm run test:time-travel 400 --shard="$CF_JEST_SHARD" --json --outputFile=coverage/shard/results.json 2>&1 | tee coverage/shard/suite.log

      - name: Keep native calendar results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-suite-shard-${{ matrix.shard }}
          path: coverage/shard/
          if-no-files-found: error
          retention-days: 1

  full-suite:
    if: always() && github.repository == 'maslennikov-ig/content-factory-app'
    name: Full test suite (required)
    needs: [full-suite-shards, time-travel-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      native-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cf-dev
          POSTGRES_PASSWORD: cf-dev-pwd
          POSTGRES_DB: cf-dev-db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cf-dev -d cf-dev-db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      native-redis:
        image: redis:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CF_TEST_PG_URL: postgresql://cf-dev:cf-dev-pwd@127.0.0.1:5433/cf-dev-db
      CF_TEST_REDIS_URL: redis://127.0.0.1:6380

    steps:
      - uses: actions/checkout@v4
      - name: Require every shard to pass
        env:
          FULL_RESULT: ${{ needs.full-suite-shards.result }}
          CALENDAR_RESULT: ${{ needs.time-travel-shards.result }}
        run: test "$FULL_RESULT" = success && test "$CALENDAR_RESULT" = success

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install pnpm 10.6.1
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-suite-shard-*'
          path: coverage/shards

      - name: Discover the complete test population
        run: pnpm exec jest --listTests --json --runInBand > coverage/expected-tests.json

      - name: Verify both complete populations, merge coverage, run Node and Python
        run: |
          set -o pipefail
          (node scripts/ci/jest-shards.cjs aggregate coverage/shards coverage/expected-tests.json coverage/complete && pnpm run test:node && pnpm run test:python) 2>&1 | tee suite.log

      - name: Confirm all three halves reported
        if: always()
        run: node scripts/ci/assert-suite-halves.cjs suite.log

      - name: Keep complete coverage and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-results
          path: |
            coverage/complete/
            coverage/expected-tests.json
            suite.log
          if-no-files-found: error
          retention-days: 7

  time-travel-suite:
    if: always() && github.repository == 'maslennikov-ig/content-factory-app'
    name: The suite, one year on
    needs: [full-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require verified calendar membership and all shards
        env:
          RESULT: ${{ needs.full-suite.result }}
        run: test "$RESULT" = success

  docker-backed-operations:
    if: github.repository == 'maslennikov-ig/content-factory-app'
    name: Docker-capable execution proofs (required)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Install pnpm 10.6.1
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required Docker-backed execution proofs
        run: ./scripts/ci/run-docker-backed-ci.sh --require-docker
